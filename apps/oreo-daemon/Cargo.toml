[package]
name = "oreo-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
default = []
voice-runtime = ["dep:oreo-audio", "dep:oreo-core", "oreo-audio/voice-runtime"]
voice-agent = ["voice-runtime", "dep:oreo-agent", "dep:tokio"]

[dependencies]
oreo-audio = { path = "../../crates/oreo-audio", optional = true }
oreo-agent = { path = "../../crates/oreo-agent", optional = true }
oreo-core = { path = "../../crates/oreo-core", optional = true }
oreo-local-api = { path = "../../crates/oreo-local-api" }
oreo-state = { path = "../../crates/oreo-state" }
tokio = { workspace = true, features = ["net", "rt", "time"], optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "oreo-daemon"
path = "src/main.rs"
