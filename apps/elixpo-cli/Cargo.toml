[package]
name = "elixpo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
default = []
vosk-stt = ["oreo-audio/vosk-stt"]

[dependencies]
oreo-agent = { path = "../../crates/oreo-agent" }
oreo-audio = { path = "../../crates/oreo-audio" }
oreo-core = { path = "../../crates/oreo-core" }
oreo-local-api = { path = "../../crates/oreo-local-api" }
tokio = { workspace = true, features = ["net", "rt", "time"] }

[lints]
workspace = true

[[bin]]
name = "elixpo"
path = "src/main.rs"
