# Creates/updates the repo-context artifact used by AI-powered CI.
# Triggers:
#   - push to main      → updates after every commit (and PR merge)
#   - workflow_dispatch → manual trigger for initial seed
# The artifact is fetched by issue-triage, pr-review, etc. for LLM context.

name: Update Repo Context Artifact

# Only keep the latest run — older pushes don't need their artifacts rebuilt.
concurrency:
  group: artifact-update
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 50

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build context
        env:
          AGENT_TOKEN: ${{ secrets.ELIXPOO_GITHUB_AGENTIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/build_artifact.py

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repo-context
          path: .elixpo-context/
          retention-days: 90
          overwrite: true
          include-hidden-files: true
