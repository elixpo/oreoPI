name: Rust Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install RustSec audit tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Rust dependencies
        run: cargo audit
