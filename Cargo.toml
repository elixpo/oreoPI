[workspace]
members = [
    "apps/elixpo-cli",
    "crates/crumb-agent",
    "crates/crumb-harness",
    "crates/crumb-llm",
    "crates/crumb-pollinations",
    "crates/oreo-agent",
    "crates/oreo-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1.0.100"
bytes = "1.11"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", features = ["blocking", "form", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["time"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
